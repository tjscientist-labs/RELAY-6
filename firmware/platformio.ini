; RELAY-6 wireless launcher firmware (Rev A).
; One tree, four roles. The safety logic is in lib/relay6_core (plain C++, host-tested: make -C test/host).
;   pio run -e padbox            RELAY-6 pad box
;   pio run -e halo|flightdeck|monolith   the three controllers
; Target: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262). An nRF52840 (e.g. RAK4631) port needs only src/common/radio.* and storage.

[platformio]
default_envs = padbox, halo, flightdeck, monolith

[env]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall -DRELAY6_REGION_US915 -Isrc/common
build_unflags = -std=gnu++11
lib_deps =
  jgromes/RadioLib@^7.1.2
  adafruit/Adafruit NeoPixel@^1.12.3

[pad_deps]
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ADS1X15@^2.5.0
  robtillaart/INA228@^0.4.1

[ctl_deps]
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@^2.36.2
  adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
  adafruit/Adafruit ADS1X15@^2.5.0

[env:padbox]
build_src_filter = +<common/> +<padbox/>
lib_deps = ${pad_deps.lib_deps}

[env:halo]
build_src_filter = +<common/> +<controller/>
build_flags = ${env.build_flags} -DPANEL_HALO
lib_deps = ${ctl_deps.lib_deps}

[env:flightdeck]
build_src_filter = +<common/> +<controller/>
build_flags = ${env.build_flags} -DPANEL_FLIGHTDECK
lib_deps = ${ctl_deps.lib_deps}

[env:monolith]
build_src_filter = +<common/> +<controller/>
build_flags = ${env.build_flags} -DPANEL_MONOLITH
lib_deps = ${ctl_deps.lib_deps}
