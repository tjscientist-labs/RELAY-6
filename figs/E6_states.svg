<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-label="E-6 Pad box states"><title>E-6 Pad box states</title><desc>SAFE, CHECKING, ARMED, FIRING and FAULT states with transitions.</desc><rect width="1100" height="850" fill="#fff"/><text x="40.0" y="52.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111" text-anchor="start" font-weight="bold" >E-6 · Pad box states</text><text x="40.0" y="76.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal" >The pad box is the authority. Any doubt sends it to SAFE; only a complete, fresh, authenticated sequence moves it forward.</text><rect x="60.0" y="200.0" width="220.0" height="100.0" rx="14" stroke="#2B8A3E" stroke-width="2.2" fill="#fff" /><text x="170.0" y="242.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#2B8A3E" text-anchor="middle" font-weight="bold" >SAFE</text><rect x="410.0" y="200.0" width="220.0" height="100.0" rx="14" stroke="#1864AB" stroke-width="2.2" fill="#fff" /><text x="520.0" y="242.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1864AB" text-anchor="middle" font-weight="bold" >CHECKING</text><rect x="760.0" y="200.0" width="220.0" height="100.0" rx="14" stroke="#D9480F" stroke-width="2.2" fill="#fff" /><text x="870.0" y="242.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#D9480F" text-anchor="middle" font-weight="bold" >ARMED</text><rect x="760.0" y="510.0" width="220.0" height="100.0" rx="14" stroke="#C92A2A" stroke-width="2.2" fill="#fff" /><text x="870.0" y="552.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#C92A2A" text-anchor="middle" font-weight="bold" >FIRING</text><rect x="60.0" y="510.0" width="220.0" height="100.0" rx="14" stroke="#555" stroke-width="2.2" fill="#fff" /><text x="170.0" y="552.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#555" text-anchor="middle" font-weight="bold" >FAULT</text><text x="170.0" y="268.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >K1 at rest · Ω readings live</text><text x="520.0" y="268.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >nonce issued · 30 s</text><text x="870.0" y="268.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >K1 on · PAD+ live · siren</text><text x="870.0" y="578.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >gates on for 1.0 s per pad</text><text x="170.0" y="578.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >K1 at rest · latched until reset</text><line x1="280.0" y1="235.0" x2="410.0" y2="235.0" stroke="#111" stroke-width="1.6" stroke-linecap="round" /><polygon points="402.6,238.1 410.0,235.0 402.6,231.9" stroke="#111" stroke-width="1.6" fill="#111" stroke-linejoin="round" /><text x="345.0" y="224.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="middle" font-weight="normal" >valid ARM-REQ</text><line x1="410.0" y1="270.0" x2="280.0" y2="270.0" stroke="#111" stroke-width="1.6" stroke-linecap="round" /><polygon points="287.4,266.9 280.0,270.0 287.4,273.1" stroke="#111" stroke-width="1.6" fill="#111" stroke-linejoin="round" /><text x="345.0" y="290.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="middle" font-weight="normal" >timeout / check fails</text><line x1="630.0" y1="235.0" x2="760.0" y2="235.0" stroke="#111" stroke-width="1.6" stroke-linecap="round" /><polygon points="752.6,238.1 760.0,235.0 752.6,231.9" stroke="#111" stroke-width="1.6" fill="#111" stroke-linejoin="round" /><text x="695.0" y="224.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="middle" font-weight="normal" >ARM + nonce OK</text><line x1="870.0" y1="300.0" x2="870.0" y2="510.0" stroke="#111" stroke-width="1.6" stroke-linecap="round" /><polygon points="866.9,502.6 870.0,510.0 873.1,502.6" stroke="#111" stroke-width="1.6" fill="#111" stroke-linejoin="round" /><text x="880.0" y="410.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal" >valid FIRE</text><line x1="760.0" y1="530.0" x2="282.0" y2="300.0" stroke="#111" stroke-width="1.6" stroke-linecap="round" /><polygon points="292.0,300.5 282.0,300.0 288.6,307.5" stroke="#111" stroke-width="1.6" fill="#111" stroke-linejoin="round" /><text x="600.0" y="420.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#111" text-anchor="start" font-weight="bold" >all pads done + 2 s</text><path d="M870,200 C720,160 320,160 170,200" stroke="#C92A2A" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" /><line x1="178.0" y1="194.0" x2="170.0" y2="200.0" stroke="#C92A2A" stroke-width="1.6" stroke-linecap="round" /><polygon points="174.5,192.2 170.0,200.0 178.7,197.8" stroke="#C92A2A" stroke-width="1.6" fill="#C92A2A" stroke-linejoin="round" /><text x="520.0" y="124.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#C92A2A" text-anchor="middle" font-weight="bold" >ANY TIME from ARMED or FIRING: no heartbeat 1 s · key OFF · FIRE released ·</text><text x="520.0" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#C92A2A" text-anchor="middle" font-weight="bold" >SAFE command · wind over limit → SAFE</text><line x1="170.0" y1="300.0" x2="170.0" y2="510.0" stroke="#555" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" /><polygon points="166.9,502.6 170.0,510.0 173.1,502.6" stroke="#555" stroke-width="1.4" fill="#555" stroke-linejoin="round" /><text x="180.0" y="410.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >battery &lt; 11.8 V · Ω short ·</text><text x="180.0" y="424.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >K1 stuck (PAD+ live while SAFE)</text><line x1="130.0" y1="510.0" x2="130.0" y2="300.0" stroke="#555" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" /><polygon points="133.1,307.4 130.0,300.0 126.9,307.4" stroke="#555" stroke-width="1.4" fill="#555" stroke-linejoin="round" /><text x="120.0" y="410.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="end" font-weight="normal" >key cycled</text><text x="120.0" y="424.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="end" font-weight="normal" >OFF → ON</text><text x="40.0" y="760.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal" >Independent of firmware: the watchdog (U2) and the key (S2) drop K1 in hardware, so a crashed or hung ESP32 cannot hold the pad box armed.</text><rect x="6.0" y="6.0" width="1088.0" height="838.0" rx="0" stroke="#111" stroke-width="1.2" fill="none" /><rect x="634.0" y="790.0" width="460.0" height="54.0" rx="0" stroke="#111" stroke-width="1.2" fill="#fff" /><line x1="634.0" y1="817.0" x2="1094.0" y2="817.0" stroke="#111" stroke-width="0.8" stroke-linecap="round" /><line x1="954.0" y1="790.0" x2="954.0" y2="844.0" stroke="#111" stroke-width="0.8" stroke-linecap="round" /><text x="642.0" y="808.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Pad box states</text><text x="642.0" y="835.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal" >Six-pad wireless launcher (open design)</text><text x="962.0" y="808.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >E-6</text><text x="962.0" y="835.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal" >Rev A · 2026-11-18 · NTS</text></svg>