<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-label="E-1 System block diagram"><title>E-1 System block diagram</title><desc>Controller and RELAY-6 pad box linked by LoRa; the pad box switches six igniters.</desc><rect width="1100" height="850" fill="#fff"/><text x="40.0" y="52.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111" text-anchor="start" font-weight="bold" >E-1 · System</text><text x="40.0" y="76.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal" >One controller (any of the three panels) pairs with one RELAY-6 pad box. Everything that can fire a rocket is in the pad box.</text><rect x="40.0" y="110.0" width="330.0" height="560.0" rx="10" stroke="#111" stroke-width="1.6" fill="#FAFAFA" /><text x="205.0" y="136.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" >CONTROLLER</text><text x="205.0" y="153.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >HALO · FLIGHTDECK · MONOLITH (same core)</text><rect x="60.0" y="172.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="193.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >ESP32-S3 + SX1262</text><text x="74.0" y="210.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >Heltec WiFi LoRa 32 V3</text><rect x="60.0" y="232.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="253.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >OLED 3.12″ 256×64</text><text x="74.0" y="270.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >SSD1322, SPI</text><rect x="60.0" y="292.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="313.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Panel inputs</text><text x="74.0" y="330.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >6 pad selects · FIRE · mode · encoder</text><rect x="60.0" y="352.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="373.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Arm key + NFC</text><text x="74.0" y="390.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >PN532, NTAG215 RSO cards</text><rect x="60.0" y="412.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="433.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Panel lights</text><text x="74.0" y="450.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >WS2812 chain via 74AHCT125</text><rect x="60.0" y="472.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="493.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Voice</text><text x="74.0" y="510.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >MAX98357A I²S + 40 mm speaker</text><rect x="60.0" y="532.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="553.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >GPS</text><text x="74.0" y="570.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >u-blox M10, UART</text><rect x="60.0" y="592.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="74.0" y="613.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Power</text><text x="74.0" y="630.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >1S2P 18650 · USB-C charge · 5 V boost · E-STOP</text><rect x="730.0" y="110.0" width="330.0" height="560.0" rx="10" stroke="#111" stroke-width="1.6" fill="#FAFAFA" /><text x="895.0" y="136.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" >RELAY-6 PAD BOX</text><text x="895.0" y="153.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >at the rack, 12 V sealed lead-acid</text><rect x="750.0" y="172.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="193.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >ESP32-S3 + SX1262</text><text x="764.0" y="210.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >Heltec WiFi LoRa 32 V3</text><rect x="750.0" y="232.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="253.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Local SAFE/ARM key</text><text x="764.0" y="270.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >in series with K1 coil</text><rect x="750.0" y="292.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="313.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Hardware watchdog</text><text x="764.0" y="330.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >CD74HC123 · ~1 s · AND ARM_EN</text><rect x="750.0" y="352.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="373.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >K1 changeover relay 40 A</text><text x="764.0" y="390.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >SAFE: PAD+ → GND · ARMED: PAD+ → +12 V</text><rect x="750.0" y="412.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="433.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >6 fire channels</text><text x="764.0" y="450.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >IRLB3034-type + TC4427, 15 A fuse each</text><rect x="750.0" y="472.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="493.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Ω meter</text><text x="764.0" y="510.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >≈0.9 mA test current, 2 × ADS1115</text><rect x="750.0" y="532.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="553.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Ignition timer</text><text x="764.0" y="570.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >INA228 + 50 A/75 mV shunt</text><rect x="750.0" y="592.0" width="290.0" height="48.0" rx="6" stroke="#111" stroke-width="1" fill="#fff" /><text x="764.0" y="613.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Beacon · siren · wind</text><text x="764.0" y="630.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >WS2812 mast · 12 V siren · anemometer</text><line x1="380.0" y1="300.0" x2="720.0" y2="300.0" stroke="#1864AB" stroke-width="2.2" stroke-linecap="round" /><polygon points="709.9,304.3 720.0,300.0 709.9,295.7" stroke="#1864AB" stroke-width="2.2" fill="#1864AB" stroke-linejoin="round" /><text x="550.0" y="288.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1864AB" text-anchor="middle" font-weight="bold" >ARM-REQ · SELECT · FIRE · HEARTBEAT 4 Hz</text><line x1="720.0" y1="360.0" x2="380.0" y2="360.0" stroke="#2B8A3E" stroke-width="2.2" stroke-linecap="round" /><polygon points="390.1,355.7 380.0,360.0 390.1,364.3" stroke="#2B8A3E" stroke-width="2.2" fill="#2B8A3E" stroke-linejoin="round" /><text x="550.0" y="384.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2B8A3E" text-anchor="middle" font-weight="bold" >CHALLENGE · Ω per pad · battery · wind · ACK · RSSI</text><rect x="420.0" y="420.0" width="260.0" height="150.0" rx="8" stroke="#111" stroke-width="1" fill="#fff" /><text x="550.0" y="444.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#111" text-anchor="middle" font-weight="bold" >LoRa 915 MHz (US) · licence-free</text><text x="436.0" y="470.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal" >• LoRa hardware CRC on every packet</text><text x="436.0" y="489.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal" >• AES-128-CMAC tag, paired key</text><text x="436.0" y="508.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal" >• 32-bit counter: no replays</text><text x="436.0" y="527.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal" >• Nonce challenge before ARM</text><text x="436.0" y="546.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal" >• No heartbeat for 1 s → SAFE</text><rect x="760.0" y="700.0" width="84.0" height="34.0" rx="5" stroke="#111" stroke-width="1" fill="#fff" /><text x="802.0" y="722.0" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#111" text-anchor="middle" font-weight="bold" >PAD 1</text><rect x="860.0" y="700.0" width="84.0" height="34.0" rx="5" stroke="#111" stroke-width="1" fill="#fff" /><text x="902.0" y="722.0" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#111" text-anchor="middle" font-weight="bold" >PAD 2</text><rect x="960.0" y="700.0" width="84.0" height="34.0" rx="5" stroke="#111" stroke-width="1" fill="#fff" /><text x="1002.0" y="722.0" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#111" text-anchor="middle" font-weight="bold" >PAD 3</text><rect x="760.0" y="746.0" width="84.0" height="34.0" rx="5" stroke="#111" stroke-width="1" fill="#fff" /><text x="802.0" y="768.0" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#111" text-anchor="middle" font-weight="bold" >PAD 4</text><rect x="860.0" y="746.0" width="84.0" height="34.0" rx="5" stroke="#111" stroke-width="1" fill="#fff" /><text x="902.0" y="768.0" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#111" text-anchor="middle" font-weight="bold" >PAD 5</text><rect x="960.0" y="746.0" width="84.0" height="34.0" rx="5" stroke="#111" stroke-width="1" fill="#fff" /><text x="1002.0" y="768.0" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#111" text-anchor="middle" font-weight="bold" >PAD 6</text><line x1="895.0" y1="670.0" x2="895.0" y2="698.0" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round" /><text x="905.0" y="690.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#D9480F" text-anchor="start" font-weight="normal" >Powerpole + clip leads, ≤ 5 m</text><text x="60.0" y="700.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal" >The controller never carries pyro current. If the controller dies, is switched off,</text><text x="60.0" y="716.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal" >or goes out of range, the pad box sees no heartbeat and drops to SAFE within ~1 s.</text><rect x="6.0" y="6.0" width="1088.0" height="838.0" rx="0" stroke="#111" stroke-width="1.2" fill="none" /><rect x="634.0" y="790.0" width="460.0" height="54.0" rx="0" stroke="#111" stroke-width="1.2" fill="#fff" /><line x1="634.0" y1="817.0" x2="1094.0" y2="817.0" stroke="#111" stroke-width="0.8" stroke-linecap="round" /><line x1="954.0" y1="790.0" x2="954.0" y2="844.0" stroke="#111" stroke-width="0.8" stroke-linecap="round" /><text x="642.0" y="808.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >System block diagram</text><text x="642.0" y="835.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal" >Six-pad wireless launcher (open design)</text><text x="962.0" y="808.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >E-1</text><text x="962.0" y="835.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal" >Rev A · 2026-11-18 · NTS</text></svg>