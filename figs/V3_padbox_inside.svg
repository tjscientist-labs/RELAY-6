<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="V-3 Pad box layout"><title>V-3 Pad box layout</title><desc>Plan view of the inside of the ammo can.</desc><rect width="1100" height="700" fill="#fff"/><rect x="104.0" y="134.0" width="896.0" height="488.0" rx="10" stroke="#4B5320" stroke-width="4" fill="#F1F2EC" /><rect x="123.6" y="153.6" width="513.4" height="221.0" rx="4" stroke="#111" stroke-width="1.2" fill="#E3E8F0" /><text x="380.3" y="262.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >BT1 12 V SLA 7.2 Ah</text><text x="380.3" y="277.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >151 × 65 × 94, strapped; terminals to the right</text><rect x="654.0" y="153.6" width="136.0" height="102.0" rx="4" stroke="#111" stroke-width="1.2" fill="#FFF1E6" /><text x="722.0" y="202.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >F0 40 A</text><text x="722.0" y="217.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >≤100 mm</text><rect x="654.0" y="269.2" width="136.0" height="105.4" rx="4" stroke="#111" stroke-width="1.2" fill="#FDE2E2" /><text x="722.0" y="319.9" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >K1</text><text x="722.0" y="334.9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >40 A changeover</text><rect x="807.0" y="153.6" width="173.4" height="221.0" rx="4" stroke="#111" stroke-width="1.2" fill="#EEE" /><text x="893.7" y="262.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >Power board</text><text x="893.7" y="277.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >Q1–Q6 on bar, F1–F6</text><rect x="123.6" y="391.6" width="408.0" height="210.8" rx="4" stroke="#111" stroke-width="1.2" fill="#E7F5EA" /><text x="327.6" y="495.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >Logic board</text><text x="327.6" y="510.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >Heltec V3, U2–U7, ADS ×2, INA228</text><rect x="545.2" y="391.6" width="136.0" height="210.8" rx="4" stroke="#111" stroke-width="1.2" fill="#EEE" /><text x="613.2" y="495.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >RS1</text><text x="613.2" y="510.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >shunt</text><rect x="694.8" y="391.6" width="285.6" height="210.8" rx="4" stroke="#111" stroke-width="1.2" fill="#F4F4F4" /><text x="837.6" y="495.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >Front panel</text><text x="837.6" y="510.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="normal" >J1–J6 · LEDs · S2</text><text x="552.0" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" >back (hinge side)</text><text x="552.0" y="646.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" >front: six Powerpole outputs and the key face the flight line</text><text x="40.0" y="46.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#111" text-anchor="start" font-weight="bold" >V-3 · Inside the pad box (plan, not to scale between parts)</text><text x="40.0" y="68.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="normal" >Heavy current runs along the top edge (battery → F0 → K1 → power board); logic stays at the bottom left, away from it.</text><text x="110.0" y="676.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal" >12 AWG: BT1 → F0 → K1 → PAD+ bus, and the return through RS1.  14 AWG: each pad.  Twisted pairs for the shunt sense leads and every pad lead.</text></svg>