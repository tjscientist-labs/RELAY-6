<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-label="E-5 Arm and fire sequence"><title>E-5 Arm and fire sequence</title><desc>Message sequence between controller and pad box.</desc><rect width="1100" height="850" fill="#fff"/><text x="40.0" y="52.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111" text-anchor="start" font-weight="bold" >E-5 · Arm and fire, message by message</text><text x="40.0" y="76.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal" >Every arrow is one LoRa packet: CRC-checked by the radio, CMAC-tagged and counter-numbered by the firmware.</text><rect x="110.0" y="100.0" width="180.0" height="40.0" rx="6" stroke="#111" stroke-width="1.4" fill="#F4F4F4" /><text x="200.0" y="126.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111" text-anchor="middle" font-weight="bold" >CONTROLLER</text><line x1="200.0" y1="140.0" x2="200.0" y2="790.0" stroke="#999" stroke-width="1.4" stroke-dasharray="6 5" stroke-linecap="round" /><rect x="590.0" y="100.0" width="180.0" height="40.0" rx="6" stroke="#111" stroke-width="1.4" fill="#F4F4F4" /><text x="680.0" y="126.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111" text-anchor="middle" font-weight="bold" >RELAY-6</text><line x1="680.0" y1="140.0" x2="680.0" y2="790.0" stroke="#999" stroke-width="1.4" stroke-dasharray="6 5" stroke-linecap="round" /><line x1="200.0" y1="180.0" x2="680.0" y2="180.0" stroke="#1864AB" stroke-width="1.8" stroke-linecap="round" /><polygon points="671.7,183.5 680.0,180.0 671.7,176.5" stroke="#1864AB" stroke-width="1.8" fill="#1864AB" stroke-linejoin="round" /><text x="440.0" y="172.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1864AB" text-anchor="middle" font-weight="bold" >HEARTBEAT 4 Hz (both ways, all the time)</text><text x="698.0" y="184.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >pad box: watchdog fed</text><line x1="680.0" y1="234.0" x2="200.0" y2="234.0" stroke="#2B8A3E" stroke-width="1.8" stroke-linecap="round" /><polygon points="208.3,230.5 200.0,234.0 208.3,237.5" stroke="#2B8A3E" stroke-width="1.8" fill="#2B8A3E" stroke-linejoin="round" /><text x="440.0" y="226.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2B8A3E" text-anchor="middle" font-weight="bold" >STATUS: Ω per pad, V batt, wind, RSSI</text><line x1="200.0" y1="288.0" x2="680.0" y2="288.0" stroke="#1864AB" stroke-width="1.8" stroke-linecap="round" /><polygon points="671.7,291.5 680.0,288.0 671.7,284.5" stroke="#1864AB" stroke-width="1.8" fill="#1864AB" stroke-linejoin="round" /><text x="440.0" y="280.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1864AB" text-anchor="middle" font-weight="bold" >SELECT pads + mode (SINGLE/SELECT/SALVO/RIPPLE/DRAG)</text><text x="698.0" y="292.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >operator: key ON, pads chosen</text><line x1="200.0" y1="342.0" x2="680.0" y2="342.0" stroke="#1864AB" stroke-width="1.8" stroke-linecap="round" /><polygon points="671.7,345.5 680.0,342.0 671.7,338.5" stroke="#1864AB" stroke-width="1.8" fill="#1864AB" stroke-linejoin="round" /><text x="440.0" y="334.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1864AB" text-anchor="middle" font-weight="bold" >ARM-REQ</text><line x1="680.0" y1="396.0" x2="200.0" y2="396.0" stroke="#2B8A3E" stroke-width="1.8" stroke-linecap="round" /><polygon points="208.3,392.5 200.0,396.0 208.3,399.5" stroke="#2B8A3E" stroke-width="1.8" fill="#2B8A3E" stroke-linejoin="round" /><text x="440.0" y="388.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2B8A3E" text-anchor="middle" font-weight="bold" >CHALLENGE nonce N (valid 30 s)</text><text x="698.0" y="400.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >checks: local key ARM, wind OK, Ω fresh + in window</text><line x1="200.0" y1="450.0" x2="680.0" y2="450.0" stroke="#1864AB" stroke-width="1.8" stroke-linecap="round" /><polygon points="671.7,453.5 680.0,450.0 671.7,446.5" stroke="#1864AB" stroke-width="1.8" fill="#1864AB" stroke-linejoin="round" /><text x="440.0" y="442.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1864AB" text-anchor="middle" font-weight="bold" >ARM { pads, mode, N } + CMAC</text><line x1="680.0" y1="504.0" x2="200.0" y2="504.0" stroke="#2B8A3E" stroke-width="1.8" stroke-linecap="round" /><polygon points="208.3,500.5 200.0,504.0 208.3,507.5" stroke="#2B8A3E" stroke-width="1.8" fill="#2B8A3E" stroke-linejoin="round" /><text x="440.0" y="496.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2B8A3E" text-anchor="middle" font-weight="bold" >ARMED ACK { pads, N }</text><text x="698.0" y="508.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >ARM_EN high → K1 energises, PAD+ live, beacon amber</text><line x1="200.0" y1="558.0" x2="680.0" y2="558.0" stroke="#1864AB" stroke-width="1.8" stroke-linecap="round" /><polygon points="671.7,561.5 680.0,558.0 671.7,554.5" stroke="#1864AB" stroke-width="1.8" fill="#1864AB" stroke-linejoin="round" /><text x="440.0" y="550.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1864AB" text-anchor="middle" font-weight="bold" >COUNT T-5 … T-1 (voice + OLED)</text><text x="698.0" y="562.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >FIRE held: releasing it at any time aborts</text><line x1="200.0" y1="612.0" x2="680.0" y2="612.0" stroke="#1864AB" stroke-width="1.8" stroke-linecap="round" /><polygon points="671.7,615.5 680.0,612.0 671.7,608.5" stroke="#1864AB" stroke-width="1.8" fill="#1864AB" stroke-linejoin="round" /><text x="440.0" y="604.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1864AB" text-anchor="middle" font-weight="bold" >FIRE { pads, mode, N } + CMAC</text><text x="698.0" y="616.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >only while FIRE is held</text><line x1="680.0" y1="666.0" x2="200.0" y2="666.0" stroke="#2B8A3E" stroke-width="1.8" stroke-linecap="round" /><polygon points="208.3,662.5 200.0,666.0 208.3,669.5" stroke="#2B8A3E" stroke-width="1.8" fill="#2B8A3E" stroke-linejoin="round" /><text x="440.0" y="658.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2B8A3E" text-anchor="middle" font-weight="bold" >FIRED { per pad: lit in t ms / NO FIRE }</text><text x="698.0" y="670.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >pad box drops ARM_EN 2 s after the last pad</text><line x1="680.0" y1="720.0" x2="200.0" y2="720.0" stroke="#2B8A3E" stroke-width="1.8" stroke-linecap="round" /><polygon points="208.3,716.5 200.0,720.0 208.3,723.5" stroke="#2B8A3E" stroke-width="1.8" fill="#2B8A3E" stroke-linejoin="round" /><text x="440.0" y="712.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2B8A3E" text-anchor="middle" font-weight="bold" >SAFE</text><text x="698.0" y="724.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="normal" >K1 at rest, beacon green, log written</text><rect x="40.0" y="770.0" width="620.0" height="60.0" rx="6" stroke="#C92A2A" stroke-width="1.2" fill="#FFF5F5" /><text x="54.0" y="792.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#C92A2A" text-anchor="start" font-weight="normal" >Abort paths: release FIRE · key OFF (either end) · E-STOP · no heartbeat 1 s ·</text><text x="54.0" y="810.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#C92A2A" text-anchor="start" font-weight="normal" >nonce expired · bad CMAC or old counter (packet ignored) · wind over limit.</text><rect x="6.0" y="6.0" width="1088.0" height="838.0" rx="0" stroke="#111" stroke-width="1.2" fill="none" /><rect x="634.0" y="790.0" width="460.0" height="54.0" rx="0" stroke="#111" stroke-width="1.2" fill="#fff" /><line x1="634.0" y1="817.0" x2="1094.0" y2="817.0" stroke="#111" stroke-width="0.8" stroke-linecap="round" /><line x1="954.0" y1="790.0" x2="954.0" y2="844.0" stroke="#111" stroke-width="0.8" stroke-linecap="round" /><text x="642.0" y="808.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Arm and fire sequence</text><text x="642.0" y="835.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal" >Six-pad wireless launcher (open design)</text><text x="962.0" y="808.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >E-5</text><text x="962.0" y="835.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal" >Rev A · 2026-11-18 · NTS</text></svg>